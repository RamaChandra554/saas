<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcomSite | Login & Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
    }
    .auth-container {
      max-width: 450px;
      margin: 50px auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 30px;
    }
    .form-toggle {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
    }
    .form-toggle button {
      width: 48%;
    }
    .toggle-password {
      cursor: pointer;
      float: right;
      margin-right: 10px;
      margin-top: -30px;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="form-toggle">
      <button class="btn btn-primary" id="loginBtn">Login</button>
      <button class="btn btn-outline-primary" id="signupBtn">Signup</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <h4 class="text-center">Login</h4>
      <div class="mb-3">
        <label for="loginEmail" class="form-label">Email address</label>
        <input type="email" class="form-control" id="loginEmail" placeholder="john@example.com" required>
      </div>
      <div class="mb-3 position-relative">
        <label for="loginPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="loginPassword" placeholder="password123" required>
        <span class="toggle-password" onclick="togglePassword('loginPassword')"></span>
      </div>
      <div id="loginAlert" class="alert alert-danger d-none" role="alert">
        Invalid credentials!
      </div>
      <button type="submit" class="btn btn-success w-100">Login</button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="d-none">
      <h4 class="text-center">Sign Up</h4>
      <div class="mb-3">
        <label for="signupName" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="signupName" placeholder="John Doe" required>
      </div>
      <div class="mb-3">
        <label for="signupEmail" class="form-label">Email address</label>
        <input type="email" class="form-control" id="signupEmail" placeholder="newuser@example.com" required>
      </div>
      <div class="mb-3 position-relative">
        <label for="signupPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="signupPassword" placeholder="newpassword123" required>
        <span class="toggle-password" onclick="togglePassword('signupPassword')"></span>
      </div>
      <div id="signupAlert" class="alert alert-success d-none" role="alert">
        Account created successfully!
      </div>
      <button type="submit" class="btn btn-primary w-100">Create Account</button>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const loginAlert = document.getElementById('loginAlert');
    const signupAlert = document.getElementById('signupAlert');

    // Dummy credentials
    const dummyUser = {
      email: 'john@example.com',
      password: 'password123'
    };

    loginBtn.addEventListener('click', () => {
      loginForm.classList.remove('d-none');
      signupForm.classList.add('d-none');
      loginBtn.classList.add('btn-primary');
      loginBtn.classList.remove('btn-outline-primary');
      signupBtn.classList.add('btn-outline-primary');
      signupBtn.classList.remove('btn-primary');
    });

    signupBtn.addEventListener('click', () => {
      signupForm.classList.remove('d-none');
      loginForm.classList.add('d-none');
      signupBtn.classList.add('btn-primary');
      signupBtn.classList.remove('btn-outline-primary');
      loginBtn.classList.add('btn-outline-primary');
      loginBtn.classList.remove('btn-primary');
    });

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      if (email === dummyUser.email && password === dummyUser.password) {
  loginAlert.classList.add('d-none');
  window.location.href = "index.html"; // ✅ Redirect here
} else {
  loginAlert.classList.remove('d-none');
}
    });

    signupForm.addEventListener('submit', function (e) {
      e.preventDefault();
      signupAlert.classList.remove('d-none');
      setTimeout(() => {
        signupAlert.classList.add('d-none');
        loginBtn.click(); // Switch to login form
      }, 2000);
    });

    function togglePassword(id) {
      const input = document.getElementById(id);
      if (input.type === "password") {
        input.type = "text";
      } else {
        input.type = "password";
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
